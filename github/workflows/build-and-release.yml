name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: build-all-platforms-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-runtime.txt
      - name: Compile source
        run: python -m compileall -q archive_scout
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  windows:
    name: Build Windows x64
    needs: test
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify GUI, TLS, and HTTP pool support
        run: python -c "import tkinter, truststore, urllib3, httpx, ahocorasick_rs; from selectolax.lexbor import LexborHTMLParser; print('Windows x64 runtime + native accelerators ready')"
      - name: Require signing for tagged Windows releases
        if: startsWith(github.ref, 'refs/tags/') && vars.ENABLE_WINDOWS_ARTIFACT_SIGNING != 'true'
        shell: pwsh
        run: throw "Tagged Windows releases require ENABLE_WINDOWS_ARTIFACT_SIGNING=true and the documented Artifact Signing configuration."
      - name: Build Windows x64 application for signing
        if: vars.ENABLE_WINDOWS_ARTIFACT_SIGNING == 'true'
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipPackaging
      - name: Build unsigned Windows x64 test package
        if: vars.ENABLE_WINDOWS_ARTIFACT_SIGNING != 'true'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Sign in to Azure for Artifact Signing
        if: vars.ENABLE_WINDOWS_ARTIFACT_SIGNING == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticode-sign ArchiveScout.exe
        if: vars.ENABLE_WINDOWS_ARTIFACT_SIGNING == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.WINDOWS_SIGNING_PROFILE_NAME }}
          files: |
            ${{ github.workspace }}\dist\ArchiveScout\ArchiveScout.exe
            ${{ github.workspace }}\dist\ArchiveScoutCLI\ArchiveScoutCLI.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Archive Scout
          description-url: https://github.com/${{ github.repository }}
      - name: Package only after signature verification
        if: vars.ENABLE_WINDOWS_ARTIFACT_SIGNING == 'true'
        shell: pwsh
        run: ./scripts/build_windows.ps1 -SkipBuild -RequireSigned
      - name: Verify Windows CLI executable
        shell: pwsh
        run: .\dist\ArchiveScoutCLI\ArchiveScoutCLI.exe --help | Out-Null
      - name: Verify Windows release files
        shell: pwsh
        run: |
          $files = @(
            "release/ArchiveScout-Windows-x64.zip",
            "release/ArchiveScout-Windows-x64.zip.sha256"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }
          Get-ChildItem release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveScout-Windows-x64
          path: |
            release/ArchiveScout-Windows-x64.zip
            release/ArchiveScout-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build Linux x64
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install system GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify GUI, TLS, and HTTP pool support
        run: python -c "import tkinter, truststore, urllib3, httpx, ahocorasick_rs; from selectolax.lexbor import LexborHTMLParser; print('Linux x64 runtime + native accelerators ready')"
      - name: Build Linux x64 package
        run: bash scripts/build_linux.sh
      - name: Verify Linux CLI executable
        run: ./dist/ArchiveScoutCLI/ArchiveScoutCLI --help >/dev/null
      - name: Verify Linux release files
        run: |
          test -f release/ArchiveScout-Linux-x64.tar.gz
          test -f release/ArchiveScout-Linux-x64.tar.gz.sha256
          ls -lah release
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveScout-Linux-x64
          path: |
            release/ArchiveScout-Linux-x64.tar.gz
            release/ArchiveScout-Linux-x64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS Universal
    needs: test
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Verify Universal2 Python, GUI, TLS, and HTTP pool support
        run: |
          python -c "import tkinter, truststore, urllib3, httpx, ahocorasick_rs; from selectolax.lexbor import LexborHTMLParser; print('macOS build runtime + native accelerators ready')"
          PYTHON_BINARY="$(python -c 'import sys; print(sys.executable)')"
          echo "Python executable: $PYTHON_BINARY"
          lipo -archs "$PYTHON_BINARY"
      - name: Build universal macOS package
        run: bash scripts/build_macos.sh
      - name: Verify macOS release files
        run: |
          test -f release/ArchiveScout-macOS-Universal.zip
          test -f release/ArchiveScout-macOS-Universal.zip.sha256
          ls -lah release
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ArchiveScout-macOS-Universal
          path: |
            release/ArchiveScout-macOS-Universal.zip
            release/ArchiveScout-macOS-Universal.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release Assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        run: |
          set -euo pipefail
          required_files=(
            "ArchiveScout-Windows-x64.zip"
            "ArchiveScout-Windows-x64.zip.sha256"
            "ArchiveScout-Linux-x64.tar.gz"
            "ArchiveScout-Linux-x64.tar.gz.sha256"
            "ArchiveScout-macOS-Universal.zip"
            "ArchiveScout-macOS-Universal.zip.sha256"
          )
          for file in "${required_files[@]}"; do
            test -f "release-assets/$file" || {
              echo "Missing release asset: $file"
              exit 1
            }
          done
          ls -lah release-assets
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Archive Scout $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" \
            release-assets/ArchiveScout-Windows-x64.zip \
            release-assets/ArchiveScout-Windows-x64.zip.sha256 \
            release-assets/ArchiveScout-Linux-x64.tar.gz \
            release-assets/ArchiveScout-Linux-x64.tar.gz.sha256 \
            release-assets/ArchiveScout-macOS-Universal.zip \
            release-assets/ArchiveScout-macOS-Universal.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
